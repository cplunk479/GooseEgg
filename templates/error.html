{% extends "base.html" %}
{% block title %}{{ code }} — Goose Egg{% endblock %}
{% block body %}
<div style="padding: 60px 24px; text-align: center;">
  <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="1.5"><path d="M12 2.5c4.4 0 7.8 5.2 7.8 10 0 5.1-3.5 8.8-7.8 8.8S4.2 17.6 4.2 12.5c0-4.8 3.4-10 7.8-10Z"/></svg>
  <div class="bar" style="font-weight: 800; font-size: 40px; margin-top: 14px; color: var(--text3);">{{ code }}</div>
  <div class="caption" style="margin-top: 6px;">{{ message }}</div>
  <div style="margin-top: 22px;"><a href="{{ url_for('board') }}">Back to the board</a></div>
</div>
{% endblock %}
