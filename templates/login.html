{% extends "base.html" %}
{% block title %}Sign in — Goose Egg{% endblock %}
{% block body %}
<div style="padding: 56px 24px 32px; text-align: center;">
  <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.6"><path d="M12 2.5c4.4 0 7.8 5.2 7.8 10 0 5.1-3.5 8.8-7.8 8.8S4.2 17.6 4.2 12.5c0-4.8 3.4-10 7.8-10Z"/></svg>
  <div class="bar" style="font-weight: 600; font-size: 10px; color: var(--text2); letter-spacing: 0.18em; margin-top: 16px;">DYNASTY DONS</div>
  <div class="bar" style="font-weight: 800; font-size: 34px; letter-spacing: 0.03em; line-height: 1.05;">GOOSE EGG</div>
  <div class="caption" style="margin-top: 8px;">Score zero, drink a beer.</div>
</div>

<form method="POST" style="padding: 0 24px 40px; display: flex; flex-direction: column; gap: 12px;">
  <div>
    <div class="overline" style="margin-bottom: 6px;">Who are you</div>
    <select class="select" name="roster_id" required>
      {% for o in owners %}
        <option value="{{ o.roster_id }}">{{ o.team_name or o.owner_name or 'Roster ' ~ o.roster_id }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <div class="overline" style="margin-bottom: 6px;">PIN</div>
    <input class="input" type="password" name="pin" inputmode="numeric" autocomplete="off"
           pattern="[0-9]*" placeholder="••••" required>
  </div>
  <button class="btn-primary" type="submit">Enter</button>
</form>
{% endblock %}
